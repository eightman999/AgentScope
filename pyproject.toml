[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentscope"
version = "0.1.0"
description = "Evidence-first audit of agentic behavior in GitHub repositories"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
dependencies = []

[project.scripts]
agentscope = "agentscope.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/agentscope/resources" = [
  "resources/action-schema.json",
  "resources/action-grammar.gbnf",
  "resources/evidence-schema.json",
  "resources/fact-graph-schema.json",
  "resources/finish-action-grammar.gbnf",
  "resources/model-manifest.json",
  "resources/report-schema.json",
  "resources/tool-action-grammar.gbnf",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
